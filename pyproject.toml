[project]
name = "rag-application"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arun Shanmugham", email = "arun.shanmugham.gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "google>=3.0.0",
    "google-cloud-aiplatform>=1.164.0",
    "google-cloud-core>=2.6.1",
    "google-genai>=2.18.1",
    "streamlit>=1.61.1",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
rag-application = "rag_application:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
